<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B403C">
  <title>Ruang Kerja | CHARIS</title>
  <link rel="icon" href="../assets/img/favicon.ico" sizes="32x32">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="kerja.css?v=20261119k">
</head>
<body>
  <!-- sign in, first password, forgot password -->
  <main class="gate" id="gate" hidden>
    <div class="gate-card">
      <img class="gate-logo" src="../assets/img/charis-mark.svg" alt="CHARIS" width="132" height="35">
      <div id="gateBody"></div>
      <a class="gate-back" href="../">Kembali ke website</a>
    </div>
  </main>

  <!-- workspace -->
  <div class="app" id="app" hidden>
    <aside class="rail" aria-label="Menu utama">
      <a class="rail-brand" href="#/dasbor"><img src="../assets/img/charis-mark-white.svg" alt="CHARIS" width="112" height="30"><span>Ruang Kerja</span></a>
      <nav class="rail-nav" id="railNav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>
    <div class="main">
      <header class="top">
        <button class="icon-btn back-btn" id="backBtn" type="button" aria-label="Kembali" hidden></button>
        <h1 class="top-title" id="topTitle">Dasbor</h1>
        <div class="top-actions">
          <span class="sync" id="syncState" aria-live="polite"></span>
          <button class="btn small cap-btn" id="capBtn" type="button" hidden>Catat peluang</button>
          <a class="icon-btn bell" id="bellBtn" href="#/notifikasi" aria-label="Notifikasi"><span class="dot" id="bellCount" hidden></span></a>
          <a class="avatar me-av" id="meBtn" href="#/profil" aria-label="Profil"></a>
        </div>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
  </div>

  <!-- task drawer and dialogs -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden><div class="modal-card" id="modalCard"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="tip" id="tip" hidden></div>

  <script src="../assets/js/config.js"></script>
  <script src="kerja.js?v=20261119k"></script>
  <script src="kerja-views.js?v=20261119k"></script>
  <script src="kerja-admin.js?v=20261119k"></script>
  <script src="kerja-xlsx.js?v=20261119k"></script>
  <script src="kerja-keuangan.js?v=20261119k"></script>
  <script src="../assets/js/i18n.js?v=20261119i"></script>
  <script src="../assets/js/content-defs.js?v=20261119k"></script>
  <script src="kerja-konten.js?v=20261119k"></script>
  <script src="kerja-peluang.js?v=20261119k"></script>
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
